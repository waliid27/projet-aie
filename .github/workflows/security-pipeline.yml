name: Node.js DevSecOps Pipeline (walid1)

# ─────────────────────────────────────────────────────────────────
# Déclencheur : push ou pull_request vers main
# ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ═══════════════════════════════════════════════════════════════
  # JOB 1 : SAST — Analyse Statique (CodeQL)
  # ═══════════════════════════════════════════════════════════════
  sast-scan:
    name: Analyse Statique CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Initialisation de CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: Auto-build du projet
        uses: github/codeql-action/autobuild@v3

      - name: Exécution de l'analyse CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # ═══════════════════════════════════════════════════════════════
  # JOB 2 : SCA — Analyse des dépendances (Trivy)
  # ═══════════════════════════════════════════════════════════════
  sca-scan:
    name: Analyse SCA Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Scan des dépendances npm
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'HIGH,CRITICAL'

  # ═══════════════════════════════════════════════════════════════
  # JOB 3 : DAST — Analyse Dynamique (OWASP ZAP)
  # Utilise httpbin comme cible de test (app web réelle)
  # ═══════════════════════════════════════════════════════════════
  dast-scan:
    name: Analyse Dynamique OWASP ZAP
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Lancer une application web de test (httpbin)
        run: |
          docker run -d -p 3000:80 kennethreitz/httpbin
          sleep 5

      - name: Accorder les permissions au conteneur ZAP
        run: chmod 777 $GITHUB_WORKSPACE

      - name: Scan OWASP ZAP
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          fail_action: false

  # ═══════════════════════════════════════════════════════════════
  # JOB 4 : Secret Scanning (Trivy)
  # BLOQUE le pipeline si un secret est trouvé dans le code
  # ═══════════════════════════════════════════════════════════════
  secret-scan:
    name: Scan de Secrets exposés
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Détection de secrets dans le code source
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          scanners: 'secret'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
